{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Clínica de Imágenes</title>
    <style>
        :root {
            --cime-teal: #3b9b9c;
            --cime-purple: #9b5fb5;
            --cime-teal-light: #e0f2f1;
            --cime-purple-light: #f3e5f5;
            --cime-teal-muted: #8ec3c4;
            --cime-purple-muted: #b98fc7;
            --cime-text: #4a4a4a;
            --cime-text-muted: #757575;
            --cime-border: #d0d0d0;
            --background-blur-radius: 10px;
            --background-opacity: 0.6;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-size-base: 16px;
            --font-size-title: 24px;
            --font-size-label: 14px;
            --font-size-button: 18px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 40px;
            --card-border-radius: 16px;
            --input-border-radius: 8px;
            --button-border-radius: 8px;
            --card-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            color: var(--cime-text);
            overflow: hidden;
            background-color: #f0f4f8;
        }

        .main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .background-blur {
            position: absolute;
            inset: -10% -10%;
            background-image: url('{% static "imagen_cime.jpg" %}');
            background-size: cover;
            background-position: center;
            filter: blur(var(--background-blur-radius));
            -webkit-filter: blur(var(--background-blur-radius));
            opacity: var(--background-opacity);
            z-index: 0;
        }

        .login-card {
            background-color: rgba(255, 255, 255, 0.96);
            width: 100%;
            max-width: 450px;
            padding: var(--spacing-xl);
            border-radius: var(--card-border-radius);
            box-shadow: var(--card-shadow);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }

        .login-logo {
            width: 100px;
            margin-bottom: var(--spacing-sm);
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .login-title {
            font-size: var(--font-size-title);
            font-weight: 600;
            color: var(--cime-teal);
            line-height: 1.2;
        }

        .login-form {
            width: 100%;
        }

        .input-group {
            width: 100%;
            margin-bottom: var(--spacing-md);
        }

        .input-group label {
            display: block;
            font-size: var(--font-size-label);
            color: var(--cime-text-muted);
            margin-bottom: var(--spacing-xs);
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: var(--spacing-md);
            border: 1px solid var(--cime-border);
            border-radius: var(--input-border-radius);
            font-size: var(--font-size-base);
            background-color: var(--cime-teal-light);
            color: var(--cime-text);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--cime-teal);
            box-shadow: 0 0 0 3px rgba(59, 155, 156, 0.15);
        }

        .login-form .errorlist {
            color: #dc2626;
            font-size: 0.85rem;
            list-style: none;
            padding: 0;
            margin-top: 6px;
            margin-bottom: 0.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: var(--spacing-md);
            background-color: var(--cime-teal-muted);
            color: #ffffff;
            border: none;
            border-radius: var(--button-border-radius);
            font-size: var(--font-size-button);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: var(--spacing-sm);
        }

        .btn-submit:hover {
            background-color: var(--cime-teal);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="background-blur" aria-hidden="true"></div>

        <div class="login-card">
            <div class="login-header">
                <img src="{% static 'imagen_cime.jpg' %}" alt="Logo CIME" class="login-logo">
                <h1 class="login-title">Clínica de Imágenes</h1>
            </div>

            <form method="post" class="login-form">
                {% csrf_token %}
                {{ form.non_field_errors }}

                <div class="input-group">
                    <label for="{{ form.username.id_for_label }}">Usuario</label>
                    {{ form.username }}
                    {{ form.username.errors }}
                </div>

                <div class="input-group">
                    <label for="{{ form.password.id_for_label }}">Contraseña</label>
                    {{ form.password }}
                    {{ form.password.errors }}
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>
        </div>
    </div>
</body>
</html>
