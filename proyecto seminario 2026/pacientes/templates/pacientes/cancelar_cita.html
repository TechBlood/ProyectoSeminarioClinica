<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cancelar / Reprogramar cita</title>
    <style>body{font-family:Arial;padding:2rem;background:#f8fafc}.card{background:#fff;padding:1.5rem;border-radius:8px;max-width:720px;margin:0 auto}label{display:block;margin-top:0.75rem}input,textarea{width:100%;padding:0.5rem;border:1px solid #d1d5db;border-radius:6px}button{margin-top:1rem;padding:0.6rem;background:#dc2626;color:white;border:none;border-radius:6px} .secondary{background:#2563eb}</style>
</head>
<body>
    <div class="card">
        <h1>Cancelar / Reprogramar cita</h1>
        <p><strong>Cita:</strong> {{ cita.paciente }} — {{ cita.fecha }} {{ cita.hora }}</p>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label>Motivo (obligatorio)</label>
            {{ form.motivo }}
            <label>Nueva fecha (si reprogramas)</label>
            {{ form.nueva_fecha }}
            <label>Nueva hora (si reprogramas)</label>
            {{ form.nueva_hora }}
            <button type="submit">Enviar</button>
            <a class="secondary" href="{% url 'calendario_coex' %}" style="display:inline-block;margin-left:8px;padding:0.5rem 0.75rem;color:white;text-decoration:none;border-radius:6px">Volver</a>
        </form>
    </div>
</body>
</html>
