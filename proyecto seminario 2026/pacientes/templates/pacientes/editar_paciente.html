<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar paciente</title>
    <style>
        body{font-family:Arial;padding:2rem;background:#f1f5f9}
        .topbar{display:flex;justify-content:space-between;align-items:center;max-width:700px;margin:0 auto 1rem}
        .topbar h1{margin:0;font-size:1.15rem;color:#0f172a}
        a.volver{color:#2563eb;text-decoration:none}
        .card{background:#fff;padding:1.5rem;border-radius:8px;max-width:700px;margin:0 auto;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
        label{display:block;margin-top:0.75rem;color:#334155}
        input,textarea{width:100%;padding:0.6rem;border:1px solid #e2e8f0;border-radius:8px;background:#fbfdff}
        button{margin-top:1rem;padding:0.6rem;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:bold}
    </style>
</head>
<body>
    <div class="topbar">
        <h1>Editar paciente — {{ paciente }}</h1>
        <a class="volver" href="{% url 'buscar_paciente' %}">&larr; Volver a búsqueda</a>
    </div>
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="{{ form.dpi.id_for_label }}">DPI</label>
            {{ form.dpi }}
            {{ form.dpi.errors }}
            <label for="{{ form.nombre.id_for_label }}">Nombre</label>
            {{ form.nombre }}
            <label for="{{ form.apellido.id_for_label }}">Apellido</label>
            {{ form.apellido }}
            <label for="{{ form.telefono.id_for_label }}">Teléfono</label>
            {{ form.telefono }}
            <label for="{{ form.fecha_nacimiento.id_for_label }}">Fecha de nacimiento</label>
            {{ form.fecha_nacimiento }}
            <label for="{{ form.expediente.id_for_label }}">Número de expediente</label>
            {{ form.expediente }}
            <button type="submit">Guardar cambios</button>
        </form>
    </div>
</body>
</html>
